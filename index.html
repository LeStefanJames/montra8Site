<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<style>
  :root {
    --bg: #faf7f2;
    --text: #1f1f1f;
    --primary: #1f1f1f;
    --whatsapp: #25D366;
    --accent-red: #e63946;
    --accent-blue: #457b9d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1b1b1b; /* shown only if fundo.jpg is missing */
    color: var(--text);
    display: flex;
    justify-content: center;
  }

  /* Background image: fixed behind everything, slightly desaturated and darkened
     so the buttons stay readable and the page looks clean/professional */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background: url("fundo.jpg") center / cover no-repeat;
    filter: grayscale(35%) saturate(.9);
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.6));
  }
  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  /* Small logo, top left, shown on both views */
  .logo {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    height: 100px;
    width: auto;
    max-width: 200px;
    object-fit: contain;
    z-index: 1;
  }

  .view {
    width: 100%;
    padding: 112px 20px 32px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .view.active { display: flex; }

  /* Home view: buttons centered vertically */
  #home { min-height: 100vh; min-height: 100dvh; justify-content: center; padding-bottom: 112px; }

  .btn {
    display: block;
    width: 100%;
    padding: 18px 20px;
    border: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.98); }
  .btn-menu { background: #fff; color: #1f1f1f; }
  .btn-wa { background: var(--whatsapp); color: #fff; }

  /* Menu view: product grid */
  .promo-banner {
    position: relative;
    background: #fff;
    color: #1f1f1f;
    font-weight: 700;
    font-size: .9rem;
    text-align: left;
    line-height: 1.3;
    padding: 16px 16px 12px;
    border-radius: 12px;
    border-left: 4px solid var(--accent-red);
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .promo-banner::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 16px;
    right: 16px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent-red);
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .product-card {
    position: relative;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    display: flex;
    flex-direction: column;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .product-card:active { transform: scale(.98); }
  .product-badge {
    background: #1f1f1f;
    color: #fff;
    font-size: .7rem;
    font-weight: 700;
    text-align: center;
    padding: 4px 8px;
    letter-spacing: .2px;
  }
  .product-cart-badge {
    display: none;
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: #1f1f1f;
    color: #fff;
    font-size: .68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .product-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .product-info {
    padding: 8px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .product-name {
    font-weight: 700;
    font-size: .95rem;
    color: #1f1f1f;
    line-height: 1.25;
  }
  .product-price {
    font-size: .85rem;
    color: #555;
  }
  .back {
    align-self: flex-start;
    background: none;
    border: none;
    font-size: 1rem;
    color: #fff;
    padding: 4px 0;
    cursor: pointer;
  }
  /* Keeps the total + WhatsApp button reachable together while scrolling a long product grid */
  .cart-footer {
    position: sticky;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cart-footer .btn-wa { box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .cart-total-row {
    display: none;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cart-total-row.visible { display: flex; }
  .cart-total-row:active { transform: scale(.98); }
  .cart-total-text { font-weight: 700; font-size: .95rem; color: #1f1f1f; }
  .cart-icon { font-size: 1.15rem; line-height: 1; }

  /* Step-by-step product configurator: size -> frame -> confirm, opened as a bottom sheet */
  .cfg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .cfg-overlay.open { opacity: 1; pointer-events: auto; }
  .cfg-sheet {
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    box-shadow: 0 -4px 20px rgba(0,0,0,.25);
  }
  .cfg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .cfg-title { font-weight: 700; font-size: 1.05rem; color: #1f1f1f; flex: 1; text-align: center; }
  .cfg-back {
    background: none;
    border: none;
    font-size: 1.3rem;
    line-height: 1;
    color: #1f1f1f;
    cursor: pointer;
    padding: 4px 8px 4px 0;
    visibility: hidden;
  }
  .cfg-close {
    background: none;
    border: none;
    font-size: 1.2rem;
    line-height: 1;
    color: #1f1f1f;
    cursor: pointer;
    padding: 4px;
  }
  .cfg-preview-img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 16px;
    display: block;
    background: #eee;
  }
  .cfg-step-label {
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: #888;
    margin-bottom: 10px;
  }
  .cfg-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .cfg-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #e3e0da;
    background: #faf7f2;
    font-size: 1rem;
    font-weight: 600;
    color: #1f1f1f;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cfg-option:active { transform: scale(.98); }
  .cfg-moldura-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .cfg-moldura-option {
    width: calc(33.333% - 7px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px;
    border-radius: 12px;
    border: 1px solid #e3e0da;
    background: #faf7f2;
    cursor: pointer;
    font-size: .75rem;
    font-weight: 600;
    color: #1f1f1f;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .cfg-moldura-option:active { transform: scale(.97); }
  .cfg-moldura-option img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    display: block;
  }
  .cfg-summary { font-size: 1rem; line-height: 1.4; margin-bottom: 16px; }
  .cfg-note {
    background: #fff4d6;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: .85rem;
    line-height: 1.4;
    margin-bottom: 18px;
  }
  .btn-add { background: #1f1f1f; color: #fff; }
  .btn-add:disabled { opacity: .4; pointer-events: none; }
  .cfg-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .cfg-field label {
    font-size: .8rem;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .cfg-field input, .cfg-field select {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #e3e0da;
    background: #faf7f2;
    font-size: 1rem;
    font-family: inherit;
    color: #1f1f1f;
  }
  .cfg-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 14px;
    margin-bottom: 4px;
  }
  .cfg-stats-grid .cfg-field { margin-bottom: 0; }
  .cfg-confirm-actions { display: flex; flex-direction: column; gap: 10px; }
  .cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .cart-item-row:last-child { border-bottom: none; }
  .cart-item-info { font-size: .9rem; line-height: 1.35; color: #1f1f1f; }
  .cart-item-remove {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--accent-red);
    color: var(--accent-red);
    font-weight: 700;
    font-size: .8rem;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cart-empty-text { font-size: .9rem; color: #777; padding: 10px 0; }

  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f1f1f;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: .85rem;
    font-weight: 600;
    text-align: center;
    max-width: 85%;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
  <img class="logo" src="logo.png" alt="Logo" onerror="this.style.display='none'">

  <!-- Main page -->
  <main id="home" class="view active">
    <button class="btn btn-menu" id="open-menu" type="button">Ver Menu</button>
    <a class="btn btn-wa" data-wa href="#">Encomendar via WhatsApp</a>
  </main>

  <!-- Menu page -->
  <section id="menu" class="view">
    <button class="back" id="back" type="button">← Voltar</button>
    <div class="promo-banner" id="promo-banner"></div>
    <div class="menu-grid" id="menu-grid"></div>
    <div class="cart-footer">
      <button type="button" class="cart-total-row" id="cart-total-row">
        <span class="cart-total-text" id="cart-total-text"></span>
        <span class="cart-icon" aria-hidden="true">🛒</span>
      </button>
      <a class="btn btn-wa" id="menu-wa" data-wa href="#">Encomendar via WhatsApp</a>
    </div>
  </section>
</div>

<div class="cfg-overlay" id="cfg-overlay">
  <div class="cfg-sheet">
    <div class="cfg-header">
      <button class="cfg-back" id="cfg-back" type="button">←</button>
      <div class="cfg-title" id="cfg-title"></div>
      <button class="cfg-close" id="cfg-close" type="button">✕</button>
    </div>
    <img class="cfg-preview-img" id="cfg-preview-img" alt="">
    <div class="cfg-body" id="cfg-body"></div>
  </div>
</div>

<div class="cfg-overlay" id="confirm-overlay">
  <div class="cfg-sheet">
    <div class="cfg-header">
      <div class="cfg-title">Aviso</div>
      <button class="cfg-close" id="confirm-close" type="button">✕</button>
    </div>
    <div class="cfg-body">
      <div class="cfg-summary" id="confirm-text"></div>
      <div class="cfg-confirm-actions">
        <button type="button" class="btn btn-menu" id="confirm-btn-menu">Voltar ao Menu</button>
        <button type="button" class="btn btn-wa" id="confirm-btn-wa">Continuar para Whatsapp</button>
      </div>
    </div>
  </div>
</div>

<div class="cfg-overlay" id="cart-overlay">
  <div class="cfg-sheet">
    <div class="cfg-header">
      <div class="cfg-title">O Meu Carrinho</div>
      <button class="cfg-close" id="cart-modal-close" type="button">✕</button>
    </div>
    <div class="cfg-body" id="cart-modal-body"></div>
  </div>
</div>

<script src="products.js"></script>
<script>
  // ====== EDIT THESE TWO THINGS ======
  // Portuguese number: country code 351 + 9 digits, no "+", no spaces. Example: 351912345678
  var PHONE = "351926541193";
  // Message that appears pre-filled in the chat (can be empty: "")
  var MESSAGE = "Olá! Gostaria de fazer uma encomenda.";
  // Banner shown at the top of the menu (set to "" to hide it)
  var PROMO = "🎉 Leva 3 Paga 2 em qualquer compra";
  // ===================================

  var url = "https://wa.me/" + PHONE + (MESSAGE ? "?text=" + encodeURIComponent(MESSAGE) : "");
  document.querySelectorAll("[data-wa]").forEach(function (a) { a.href = url; });

  var promoBanner = document.getElementById("promo-banner");
  if (PROMO) { promoBanner.textContent = PROMO; } else { promoBanner.style.display = "none"; }

  function formatPrice(v) {
    return v.toFixed(2).replace(".", ",") + "€";
  }

  function priceLine(p) {
    var parts = [];
    if (p.priceA3 != null) parts.push("A3: " + formatPrice(p.priceA3));
    if (p.priceA4 != null) parts.push("A4: " + formatPrice(p.priceA4));
    return parts.join("<br>");
  }

  // Keeps the page behind an open overlay from scrolling along with it (iOS Safari especially)
  var scrollLockCount = 0;
  var scrollLockY = 0;
  function lockBodyScroll() {
    if (scrollLockCount === 0) {
      scrollLockY = window.scrollY || window.pageYOffset || 0;
      document.body.style.position = "fixed";
      document.body.style.top = (-scrollLockY) + "px";
      document.body.style.left = "0";
      document.body.style.right = "0";
    }
    scrollLockCount++;
  }
  function unlockBodyScroll() {
    scrollLockCount = Math.max(0, scrollLockCount - 1);
    if (scrollLockCount === 0) {
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      window.scrollTo(0, scrollLockY);
    }
  }

  var menuGrid = document.getElementById("menu-grid");
  var menuWaBtn = document.getElementById("menu-wa");
  var cfgOverlay = document.getElementById("cfg-overlay");
  var cfgTitle = document.getElementById("cfg-title");
  var cfgBody = document.getElementById("cfg-body");
  var cfgClose = document.getElementById("cfg-close");
  var cfgBack = document.getElementById("cfg-back");
  var cfgPreviewImg = document.getElementById("cfg-preview-img");

  var cart = []; // { productIndex, type, name, size, frame, moldura, price }
  var cartBadges = []; // "Nx no carrinho" badge element per product card, by product index

  function cartLines() {
    return cart.map(function (item) {
      var frameText = item.frame ? (" com moldura" + (item.moldura ? " " + molduraLabel(item.moldura) : "")) : "";
      if (item.type === "FifaCard") {
        var f = item.fifaFields;
        return '- Fifa Card do tipo ' + molduraLabel(item.fifaTemplate) + " em " + item.size + frameText + ".\n" +
          "  Nome: " + f.nome + "\n" +
          "  Nacionalidade: " + f.nacionalidade + "\n" +
          "  Overall: " + f.overall + "\n" +
          "  Clube: " + f.clube + "\n" +
          "  Posição: " + f.posicao + "\n" +
          "  Stats: " + fifaStatsSummary(f);
      }
      return '- Poster "' + item.name + '" em tamanho ' + item.size + frameText + ".";
    }).join("\n");
  }

  // Promo: every 3rd item (cheapest) within the same type+frame combo is free ("Leva 3 Paga 2")
  function cartTotal() {
    var groups = {};
    cart.forEach(function (item) {
      // "User Defined Poster" shares the same 3-for-2 pool as "poster" (frame still matters)
      var typeKey = (item.type === "poster" || item.type === "User Defined Poster") ? "poster" : item.type;
      var key = typeKey + (item.frame ? ":framed" : ":plain");
      (groups[key] = groups[key] || []).push(item.price);
    });
    var total = 0;
    Object.keys(groups).forEach(function (key) {
      var prices = groups[key].slice().sort(function (a, b) { return b - a; });
      prices.forEach(function (price, idx) { if ((idx + 1) % 3 !== 0) total += price; });
    });
    return total;
  }

  var cartTotalRow = document.getElementById("cart-total-row");
  var cartTotalText = document.getElementById("cart-total-text");
  function updateCartTotal() {
    if (cart.length === 0) { cartTotalRow.classList.remove("visible"); return; }
    cartTotalRow.classList.add("visible");
    cartTotalText.textContent = "Total: " + formatPrice(cartTotal());
  }
  cartTotalRow.addEventListener("click", function () {
    openCartModal();
  });

  function updateMenuWaButton() {
    if (cart.length === 0) {
      menuWaBtn.href = url;
      menuWaBtn.textContent = "Encomendar via WhatsApp";
      return;
    }
    var text = "Olá. Gostaria de fazer uma encomenda:\n" + cartLines();
    menuWaBtn.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(text);
    menuWaBtn.textContent = "Encomendar via WhatsApp (" + cart.length + ")";
  }

  function updateCartBadge(productIndex) {
    var count = cart.filter(function (item) { return item.productIndex === productIndex; }).length;
    var badge = cartBadges[productIndex];
    if (!badge) return;
    badge.style.display = count > 0 ? "block" : "none";
    badge.textContent = count + "x no carrinho";
  }

  function renderCartModal() {
    var body = document.getElementById("cart-modal-body");
    body.innerHTML = "";
    if (cart.length === 0) {
      var empty = document.createElement("div");
      empty.className = "cart-empty-text";
      empty.textContent = "O teu carrinho está vazio.";
      body.appendChild(empty);
      return;
    }
    cart.forEach(function (item, idx) {
      var frameText = item.frame ? (" com moldura" + (item.moldura ? " (" + molduraLabel(item.moldura) + ")" : "")) : "";
      var detail = item.type === "FifaCard"
        ? item.name + " — " + molduraLabel(item.fifaTemplate) + " — " + item.size + frameText +
          "<br>" + item.fifaFields.nome + " (" + item.fifaFields.posicao + ", " + item.fifaFields.overall + ")"
        : item.name + " — " + item.size + frameText;
      var row = document.createElement("div");
      row.className = "cart-item-row";
      row.innerHTML =
        '<div class="cart-item-info">' + detail + "<br>" + formatPrice(item.price) + "</div>" +
        '<button type="button" class="cart-item-remove">Remover</button>';
      row.querySelector(".cart-item-remove").addEventListener("click", function () { removeCartItem(idx); });
      body.appendChild(row);
    });
  }

  function removeCartItem(idx) {
    var removed = cart.splice(idx, 1)[0];
    updateCartBadge(removed.productIndex);
    updateMenuWaButton();
    updateCartTotal();
    renderCartModal();
  }

  var cartOverlay = document.getElementById("cart-overlay");
  function openCartModal() { renderCartModal(); lockBodyScroll(); cartOverlay.classList.add("open"); }
  function closeCartModal() { cartOverlay.classList.remove("open"); unlockBodyScroll(); }
  document.getElementById("cart-modal-close").addEventListener("click", closeCartModal);
  cartOverlay.addEventListener("click", function (e) { if (e.target === cartOverlay) closeCartModal(); });

  var confirmOverlay = document.getElementById("confirm-overlay");
  var confirmText = document.getElementById("confirm-text");
  function closeConfirm() { confirmOverlay.classList.remove("open"); unlockBodyScroll(); }
  document.getElementById("confirm-close").addEventListener("click", closeConfirm);
  confirmOverlay.addEventListener("click", function (e) { if (e.target === confirmOverlay) closeConfirm(); });
  document.getElementById("confirm-btn-menu").addEventListener("click", closeConfirm);
  document.getElementById("confirm-btn-wa").addEventListener("click", function () {
    closeConfirm();
    window.location.href = menuWaBtn.href;
  });
  menuWaBtn.addEventListener("click", function (e) {
    if (cart.length === 0) {
      e.preventDefault();
      confirmText.textContent = "Nenhum poster selecionado";
      lockBodyScroll();
      confirmOverlay.classList.add("open");
    }
  });

  var toastEl = null;
  function showToast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function closeConfigurator() { cfgOverlay.classList.remove("open"); unlockBodyScroll(); cfgHistory = []; }
  cfgClose.addEventListener("click", closeConfigurator);
  cfgOverlay.addEventListener("click", function (e) { if (e.target === cfgOverlay) closeConfigurator(); });

  // Step history for the configurator sheet, so "Voltar" can re-render the previous step
  var cfgHistory = [];
  function cfgUpdateBackVisibility() { cfgBack.style.visibility = cfgHistory.length > 1 ? "visible" : "hidden"; }
  function cfgGoToStep(renderFn) { cfgHistory.push(renderFn); renderFn(); cfgUpdateBackVisibility(); }
  function cfgReplaceStep(renderFn) { cfgHistory[cfgHistory.length - 1] = renderFn; renderFn(); cfgUpdateBackVisibility(); }
  function cfgGoBack() {
    if (cfgHistory.length <= 1) return;
    cfgHistory.pop();
    cfgHistory[cfgHistory.length - 1]();
    cfgUpdateBackVisibility();
  }
  cfgBack.addEventListener("click", cfgGoBack);

  function renderCfgOptions(options) {
    var wrap = document.createElement("div");
    wrap.className = "cfg-options";
    options.forEach(function (opt) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cfg-option";
      btn.innerHTML = "<span>" + opt.label + "</span><span>" + formatPrice(opt.price) + "</span>";
      btn.addEventListener("click", opt.onSelect);
      wrap.appendChild(btn);
    });
    cfgBody.appendChild(wrap);
  }

  function cfgStepLabel(text) {
    var label = document.createElement("div");
    label.className = "cfg-step-label";
    label.textContent = text;
    cfgBody.appendChild(label);
  }

  function showSizeStep(p, productIndex) {
    cfgTitle.textContent = p.name;
    cfgBody.innerHTML = "";
    cfgStepLabel("Escolhe o tamanho");
    var sizes = [];
    if (p.priceA3 != null) sizes.push({ size: "A3", price: p.priceA3 });
    if (p.priceA4 != null) sizes.push({ size: "A4", price: p.priceA4 });
    renderCfgOptions(sizes.map(function (s) {
      return {
        label: s.size,
        price: s.price,
        onSelect: function () { cfgGoToStep(function () { showFrameStep(p, productIndex, s.size, s.price); }); }
      };
    }));
  }

  function showFrameStep(p, productIndex, size, basePrice) {
    var molduraPrice = size === "A3" ? p.priceMolduraA3 : p.priceMolduraA4;
    if (molduraPrice == null) {
      cfgReplaceStep(function () { showConfirmStep(p, productIndex, size, false, basePrice, null); });
      return;
    }
    cfgBody.innerHTML = "";
    cfgStepLabel("Apenas poster ou com moldura?");
    renderCfgOptions([
      { label: "Apenas Poster", price: basePrice, onSelect: function () { cfgGoToStep(function () { showConfirmStep(p, productIndex, size, false, basePrice, null); }); } },
      { label: "Poster com Moldura", price: molduraPrice, onSelect: function () { cfgGoToStep(function () { showMolduraStep(p, productIndex, size, molduraPrice); }); } }
    ]);
  }

  function molduraLabel(filename) {
    return filename.replace(/\.[^.]+$/, "").replace(/[-_]/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function showMolduraStep(p, productIndex, size, price) {
    var molduras = typeof MOLDURAS !== "undefined" ? MOLDURAS : [];
    if (molduras.length === 0) {
      cfgReplaceStep(function () { showConfirmStep(p, productIndex, size, true, price, null); });
      return;
    }
    cfgBody.innerHTML = "";
    cfgStepLabel("Escolhe a moldura");
    var grid = document.createElement("div");
    grid.className = "cfg-moldura-grid";
    molduras.forEach(function (filename) {
      var opt = document.createElement("button");
      opt.type = "button";
      opt.className = "cfg-moldura-option";
      opt.innerHTML = '<img src="molduras/' + filename + '" alt="' + molduraLabel(filename) + '">' +
        "<span>" + molduraLabel(filename) + "</span>";
      opt.addEventListener("click", function () { cfgGoToStep(function () { showConfirmStep(p, productIndex, size, true, price, filename); }); });
      grid.appendChild(opt);
    });
    cfgBody.appendChild(grid);
  }

  function showConfirmStep(p, productIndex, size, framed, price, moldura) {
    var frameSummary = framed ? " com moldura" + (moldura ? " (" + molduraLabel(moldura) + ")" : "") : "";
    cfgBody.innerHTML =
      '<div class="cfg-summary">' + p.name + " — " + size + frameSummary + " — " + formatPrice(price) + "</div>" +
      (p.type === "User Defined Poster"
        ? '<div class="cfg-note">Envia-nos por WhatsApp o poster que pretendes imprimir, e nós tratamos do resto.</div>'
        : "") +
      '<button type="button" class="btn btn-add" id="cfg-add">Adicionar ao Carrinho</button>';
    document.getElementById("cfg-add").addEventListener("click", function () {
      cart.push({ productIndex: productIndex, type: p.type, name: p.name, size: size, frame: framed, moldura: moldura, price: price });
      updateCartBadge(productIndex);
      updateMenuWaButton();
      updateCartTotal();
      closeConfigurator();
      showToast("Adicionado ao carrinho ✅");
    });
  }

  function openConfigurator(p, productIndex) {
    cfgPreviewImg.src = p.image;
    cfgPreviewImg.alt = p.name;
    cfgHistory = [];
    lockBodyScroll();
    cfgGoToStep(function () { showSizeStep(p, productIndex); });
    cfgOverlay.classList.add("open");
  }

  // ---- FifaCard flow: size -> template -> player fields -> frame -> confirm ----

  function showFifaSizeStep(p, productIndex) {
    cfgTitle.textContent = p.name;
    cfgBody.innerHTML = "";
    cfgStepLabel("Escolhe o tamanho");
    var sizes = [];
    if (p.priceA3 != null) sizes.push({ size: "A3", price: p.priceA3 });
    if (p.priceA4 != null) sizes.push({ size: "A4", price: p.priceA4 });
    renderCfgOptions(sizes.map(function (s) {
      return {
        label: s.size,
        price: s.price,
        onSelect: function () { cfgGoToStep(function () { showFifaTemplateStep(p, productIndex, s.size, s.price); }); }
      };
    }));
  }

  function showFifaTemplateStep(p, productIndex, size, basePrice) {
    var templates = typeof FIFA_TEMPLATES !== "undefined" ? FIFA_TEMPLATES : [];
    cfgBody.innerHTML = "";
    cfgStepLabel("Escolhe o template");
    if (templates.length === 0) {
      var warn = document.createElement("div");
      warn.className = "cfg-note";
      warn.textContent = "Nenhum template disponível.";
      cfgBody.appendChild(warn);
      return;
    }
    var grid = document.createElement("div");
    grid.className = "cfg-moldura-grid";
    templates.forEach(function (filename) {
      var opt = document.createElement("button");
      opt.type = "button";
      opt.className = "cfg-moldura-option";
      opt.innerHTML = '<img src="FifaTemplate/' + filename + '" alt="' + molduraLabel(filename) + '">' +
        "<span>" + molduraLabel(filename) + "</span>";
      opt.addEventListener("click", function () {
        cfgGoToStep(function () {
          cfgPreviewImg.src = "FifaTemplate/" + filename;
          cfgPreviewImg.alt = molduraLabel(filename);
          showFifaFieldsStep(p, productIndex, size, basePrice, filename);
        });
      });
      grid.appendChild(opt);
    });
    cfgBody.appendChild(grid);
  }

  var FIFA_POSITIONS = ["GK", "RB", "LB", "CB", "CDM", "CM", "CAM", "RW", "LW", "CF", "ST"];
  var FIFA_STATS = [["pac", "PAC"], ["sho", "SHO"], ["pas", "PAS"], ["dri", "DRI"], ["def", "DEF"], ["phy", "PHY"]];

  function showFifaFieldsStep(p, productIndex, size, basePrice, template) {
    cfgBody.innerHTML = "";
    cfgStepLabel("Preenche os dados da carta");

    var fields = { nome: "", nacionalidade: "", overall: "", clube: "", posicao: "", pac: "", sho: "", pas: "", dri: "", def: "", phy: "" };
    var continueBtn;

    function updateContinueState() {
      var allFilled = Object.keys(fields).every(function (key) { return fields[key] !== ""; });
      continueBtn.disabled = !allFilled;
    }

    function makeTextField(key, label) {
      var wrap = document.createElement("div");
      wrap.className = "cfg-field";
      var lab = document.createElement("label");
      lab.textContent = label;
      var input = document.createElement("input");
      input.type = "text";
      input.addEventListener("input", function () { fields[key] = input.value.trim(); updateContinueState(); });
      wrap.appendChild(lab);
      wrap.appendChild(input);
      return wrap;
    }

    function makeDigitsField(key, label) {
      var wrap = document.createElement("div");
      wrap.className = "cfg-field";
      var lab = document.createElement("label");
      lab.textContent = label;
      var input = document.createElement("input");
      input.type = "text";
      input.inputMode = "numeric";
      input.maxLength = 2;
      input.addEventListener("input", function () {
        input.value = input.value.replace(/\D/g, "").slice(0, 2);
        fields[key] = input.value;
        updateContinueState();
      });
      wrap.appendChild(lab);
      wrap.appendChild(input);
      return wrap;
    }

    cfgBody.appendChild(makeTextField("nome", "Nome"));
    cfgBody.appendChild(makeTextField("nacionalidade", "Nacionalidade"));
    cfgBody.appendChild(makeDigitsField("overall", "Valor Overall"));
    cfgBody.appendChild(makeTextField("clube", "Clube"));

    var posWrap = document.createElement("div");
    posWrap.className = "cfg-field";
    var posLabel = document.createElement("label");
    posLabel.textContent = "Posição";
    var posSelect = document.createElement("select");
    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "-- Seleciona --";
    posSelect.appendChild(placeholder);
    FIFA_POSITIONS.forEach(function (pos) {
      var opt = document.createElement("option");
      opt.value = pos;
      opt.textContent = pos;
      posSelect.appendChild(opt);
    });
    posSelect.addEventListener("change", function () { fields.posicao = posSelect.value; updateContinueState(); });
    posWrap.appendChild(posLabel);
    posWrap.appendChild(posSelect);
    cfgBody.appendChild(posWrap);

    cfgStepLabel("Stats");
    var statsGrid = document.createElement("div");
    statsGrid.className = "cfg-stats-grid";
    FIFA_STATS.forEach(function (pair) { statsGrid.appendChild(makeDigitsField(pair[0], pair[1])); });
    cfgBody.appendChild(statsGrid);

    continueBtn = document.createElement("button");
    continueBtn.type = "button";
    continueBtn.className = "btn btn-add";
    continueBtn.textContent = "Continuar";
    continueBtn.disabled = true;
    continueBtn.addEventListener("click", function () { cfgGoToStep(function () { showFifaFrameStep(p, productIndex, size, basePrice, template, fields); }); });
    cfgBody.appendChild(continueBtn);
  }

  function showFifaFrameStep(p, productIndex, size, basePrice, template, fields) {
    var molduraPrice = size === "A3" ? p.priceMolduraA3 : p.priceMolduraA4;
    if (molduraPrice == null) {
      cfgReplaceStep(function () { showFifaConfirmStep(p, productIndex, size, false, basePrice, null, template, fields); });
      return;
    }
    cfgBody.innerHTML = "";
    cfgStepLabel("Apenas poster ou com moldura?");
    renderCfgOptions([
      { label: "Apenas Poster", price: basePrice, onSelect: function () { cfgGoToStep(function () { showFifaConfirmStep(p, productIndex, size, false, basePrice, null, template, fields); }); } },
      { label: "Poster com Moldura", price: molduraPrice, onSelect: function () { cfgGoToStep(function () { showFifaMolduraStep(p, productIndex, size, molduraPrice, template, fields); }); } }
    ]);
  }

  function showFifaMolduraStep(p, productIndex, size, price, template, fields) {
    var molduras = typeof MOLDURAS !== "undefined" ? MOLDURAS : [];
    if (molduras.length === 0) {
      cfgReplaceStep(function () { showFifaConfirmStep(p, productIndex, size, true, price, null, template, fields); });
      return;
    }
    cfgBody.innerHTML = "";
    cfgStepLabel("Escolhe a moldura");
    var grid = document.createElement("div");
    grid.className = "cfg-moldura-grid";
    molduras.forEach(function (filename) {
      var opt = document.createElement("button");
      opt.type = "button";
      opt.className = "cfg-moldura-option";
      opt.innerHTML = '<img src="molduras/' + filename + '" alt="' + molduraLabel(filename) + '">' +
        "<span>" + molduraLabel(filename) + "</span>";
      opt.addEventListener("click", function () { cfgGoToStep(function () { showFifaConfirmStep(p, productIndex, size, true, price, filename, template, fields); }); });
      grid.appendChild(opt);
    });
    cfgBody.appendChild(grid);
  }

  function fifaStatsSummary(fields) {
    return FIFA_STATS.map(function (pair) { return pair[1] + " " + fields[pair[0]]; }).join(" · ");
  }

  function showFifaConfirmStep(p, productIndex, size, framed, price, moldura, template, fields) {
    var frameSummary = framed ? " com moldura" + (moldura ? " (" + molduraLabel(moldura) + ")" : "") : "";
    cfgBody.innerHTML =
      '<div class="cfg-summary">' + p.name + " — " + molduraLabel(template) + " — " + size + frameSummary + " — " + formatPrice(price) + "</div>" +
      '<div class="cfg-summary">' + fields.nome + " (" + fields.nacionalidade + ") — " + fields.clube + " — " + fields.posicao + " — Overall " + fields.overall + "<br>" + fifaStatsSummary(fields) + "</div>" +
      '<button type="button" class="btn btn-add" id="cfg-add">Adicionar ao Carrinho</button>';
    document.getElementById("cfg-add").addEventListener("click", function () {
      cart.push({
        productIndex: productIndex, type: p.type, name: p.name, size: size, frame: framed, moldura: moldura, price: price,
        fifaTemplate: template, fifaFields: fields
      });
      updateCartBadge(productIndex);
      updateMenuWaButton();
      updateCartTotal();
      closeConfigurator();
      showToast("Envia-nos a foto do(a) craque que queres colocar nesta carta quando falarmos por whatsapp!");
    });
  }

  function openFifaConfigurator(p, productIndex) {
    cfgPreviewImg.src = p.image;
    cfgPreviewImg.alt = p.name;
    cfgHistory = [];
    lockBodyScroll();
    cfgGoToStep(function () { showFifaSizeStep(p, productIndex); });
    cfgOverlay.classList.add("open");
  }

  (typeof PRODUCTS !== "undefined" ? PRODUCTS : []).forEach(function (p, i) {
    var card = document.createElement("div");
    card.className = "product-card";
    var badgeHtml = p.extraInfo
      ? '<div class="product-badge" style="background:' + (p.extraInfoColor || "#1f1f1f") + '">' + p.extraInfo + "</div>"
      : "";
    card.innerHTML =
      badgeHtml +
      '<img class="product-img" src="' + p.image + '" alt="' + p.name + '">' +
      '<div class="product-info">' +
        '<div class="product-name">' + p.name + "</div>" +
        '<div class="product-price">' + priceLine(p) + "</div>" +
      "</div>" +
      '<div class="product-cart-badge"></div>';
    cartBadges[i] = card.querySelector(".product-cart-badge");
    card.addEventListener("click", function () {
      if (p.type === "poster" || p.type === "User Defined Poster") {
        openConfigurator(p, i);
      } else if (p.type === "FifaCard") {
        openFifaConfigurator(p, i);
      } else {
        showToast("Brevemente disponível 🙂");
      }
    });
    menuGrid.appendChild(card);
  });

  var home = document.getElementById("home");
  var menu = document.getElementById("menu");

  function show(view) {
    home.classList.toggle("active", view === "home");
    menu.classList.toggle("active", view === "menu");
    window.scrollTo(0, 0);
  }

  document.getElementById("open-menu").addEventListener("click", function () {
    location.hash = "menu";
  });
  document.getElementById("back").addEventListener("click", function () {
    history.length > 1 ? history.back() : (location.hash = "");
  });
  window.addEventListener("hashchange", function () {
    show(location.hash === "#menu" ? "menu" : "home");
  });
  show(location.hash === "#menu" ? "menu" : "home");
</script>
</body>
</html>
